<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>完整清单 · 仓库导航</title>
  <meta name="description" content="Minecraft 仓库 721 件物品的完整清单：按区域、分类和名称筛选，支持导出 CSV。">
  <meta name="theme-color" content="#0b1117">
  <meta property="og:title" content="完整清单 · 仓库导航">
  <meta property="og:description" content="721 件物品，逐条可查；按区域、分类、名称筛选并导出 CSV。">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1117'/%3E%3Cpath d='M18 46 L42 22' stroke='%236fe0a0' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M26 16 C36 12 46 16 50 24 C42 30 34 28 30 22' fill='none' stroke='%236fe0a0' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body data-page="items">
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">⛏</span>
        <span>
          <strong>仓库导航</strong>
          <small>Minecraft Warehouse</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="主要导航">
        <a href="index.html" data-nav="index">总览</a>
        <a href="map.html" data-nav="map">地图</a>
        <a href="items.html" data-nav="items" aria-current="page">清单</a>
        <a href="about.html" data-nav="about">说明</a>
      </nav>
    </div>
  </header>

  <main id="main" class="page">
    <div class="shell">
      <div class="page-head">
        <div>
          <p class="eyebrow">完整清单</p>
          <h1>721 件物品，逐条可查</h1>
          <p class="lede">
            按名称、编码、区域或分类筛选，点开任意一条查看相邻物品。
            也可以把当前筛选结果导出为 CSV。
          </p>
        </div>
        <p class="muted">
          共 <strong data-stat="used">721</strong> 件 ·
          <strong data-stat="categories">8</strong> 个分类
        </p>
      </div>

      <section class="panel filter-panel" aria-label="筛选条件">
        <form class="filter-grid" id="filters" role="search">
          <div class="field search-field">
            <label for="q">搜索</label>
            <input id="q" name="q" type="search" placeholder="名称、编码、区域或分类…"
                   autocomplete="off" spellcheck="false">
          </div>
          <div class="field">
            <label for="zone-filter">区域</label>
            <select id="zone-filter" name="zone">
              <option value="">全部区域</option>
            </select>
          </div>
          <div class="field">
            <label for="cat-filter">分类</label>
            <select id="cat-filter" name="cat">
              <option value="">全部分类</option>
            </select>
          </div>
          <div class="field">
            <label for="sort-filter">排序</label>
            <select id="sort-filter" name="sort">
              <option value="name">按名称</option>
              <option value="code">按编码</option>
              <option value="zone">按区域</option>
              <option value="category">按分类</option>
              <option value="relevance">按相关度</option>
            </select>
          </div>
          <button type="button" class="btn ghost" id="reset">重置</button>
        </form>
      </section>

      <section class="panel list-panel" aria-label="物品列表">
        <div class="list-head">
          <p id="list-count" aria-live="polite">正在载入…</p>
          <button type="button" class="btn ghost small" id="export">导出筛选结果 CSV</button>
        </div>

        <div class="item-rows" id="rows"></div>
        <div class="empty" id="list-empty" hidden></div>

        <nav class="pager" id="pager" aria-label="分页"></nav>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="shell footer-inner">
      <p>
        共 <strong data-stat="used">721</strong> 件物品 ·
        <strong data-stat="total">722</strong> 个格位 ·
        <strong data-stat="zones">6</strong> 个区域
      </p>
      <p><a href="about.html">坐标规则与更新说明</a></p>
    </div>
  </footer>

  <script src="assets/data.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/items.js"></script>
</body>
</html>
